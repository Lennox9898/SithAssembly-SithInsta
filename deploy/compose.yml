name: sithassembly

services:
  api:
    profiles: ["compatibility"]
    build:
      context: ..
      dockerfile: deploy/Containerfile
    environment:
      SITH_DEPLOYMENT_PROFILE: prepared_local
      SITH_DATA_DIR: /var/lib/sithassembly/data
      SITH_RUNTIME_DIR: /var/lib/sithassembly/runtime
      SITH_HUGGINGFACE_CACHE_DIR: /var/lib/sithassembly/runtime/huggingface
      SITH_PADDLEX_CACHE_DIR: /var/lib/sithassembly/runtime/paddlex
      SITH_API_TOKEN: ${SITH_API_TOKEN:?Set SITH_API_TOKEN outside version control}
    ports:
      - "127.0.0.1:${SITH_API_PORT:-8080}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp
    volumes:
      - ${SITH_HOST_DATA_DIR:-../data}:/var/lib/sithassembly/data
      - ${SITH_HOST_RUNTIME_DIR:-../.runtime}:/var/lib/sithassembly/runtime

  api-gpu:
    profiles: ["gpu"]
    build:
      context: ..
      dockerfile: deploy/Containerfile
      args:
        SITH_ENABLE_GLYPHWATCH: "1"
    environment:
      SITH_DEPLOYMENT_PROFILE: prepared_gpu
      SITH_DATA_DIR: /var/lib/sithassembly/data
      SITH_RUNTIME_DIR: /var/lib/sithassembly/runtime
      SITH_HUGGINGFACE_CACHE_DIR: /var/lib/sithassembly/runtime/huggingface
      SITH_PADDLEX_CACHE_DIR: /var/lib/sithassembly/runtime/paddlex
      SITH_API_TOKEN: ${SITH_API_TOKEN:?Set SITH_API_TOKEN outside version control}
    ports:
      - "127.0.0.1:${SITH_API_PORT:-8080}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp
    volumes:
      - ${SITH_HOST_DATA_DIR:-../data}:/var/lib/sithassembly/data
      - ${SITH_HOST_RUNTIME_DIR:-../.runtime}:/var/lib/sithassembly/runtime
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  worker:
    profiles: ["workers"]
    build:
      context: ..
      dockerfile: deploy/Containerfile
    command: ["python", "SithAssembly.Deploy.py", "preflight"]
    environment:
      SITH_DEPLOYMENT_PROFILE: prepared_local
      SITH_DATA_DIR: /var/lib/sithassembly/data
      SITH_RUNTIME_DIR: /var/lib/sithassembly/runtime
    volumes:
      - ${SITH_HOST_DATA_DIR:-../data}:/var/lib/sithassembly/data
      - ${SITH_HOST_RUNTIME_DIR:-../.runtime}:/var/lib/sithassembly/runtime

  postgres:
    profiles: ["infrastructure"]
    image: ${SITH_POSTGRES_IMAGE:?Set a verified immutable PostgreSQL image digest in deploy/.env.local}
    environment:
      POSTGRES_DB: ${SITH_POSTGRES_DB:-sithassembly}
      POSTGRES_USER: ${SITH_POSTGRES_USER:-sithassembly}
      POSTGRES_PASSWORD: ${SITH_POSTGRES_PASSWORD:?Set SITH_POSTGRES_PASSWORD outside version control}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6

  nats:
    profiles: ["infrastructure"]
    image: ${SITH_NATS_IMAGE:?Set a verified immutable NATS image digest in deploy/.env.local}
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "nats-server", "--help"]
      interval: 30s
      timeout: 5s
      retries: 3

  object-storage:
    profiles: ["infrastructure"]
    image: ${SITH_STORAGE_IMAGE:?Set a verified immutable S3-compatible storage image digest in deploy/.env.local}
    environment:
      MINIO_ROOT_USER: ${SITH_STORAGE_ACCESS_KEY:?Set SITH_STORAGE_ACCESS_KEY outside version control}
      MINIO_ROOT_PASSWORD: ${SITH_STORAGE_SECRET_KEY:?Set SITH_STORAGE_SECRET_KEY outside version control}
    command: ["server", "/data"]
    volumes:
      - object_storage_data:/data

volumes:
  postgres_data:
  nats_data:
  object_storage_data:
